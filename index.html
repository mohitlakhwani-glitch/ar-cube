<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Cube</title>
  <!-- Updated reliable CDN script -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    body { margin: 0; padding: 0; width: 100vw; height: 100vh; background-color: #222; }
    model-viewer { width: 100%; height: 100%; }
  </style>
</head>
<body>

  <model-viewer 
  src="./cube.glb" 
  alt="A 3D Cube" 
  ar 
  ar-modes="scene-viewer webxr quick-look" 
  camera-controls 
  shadow-intensity="1">
  
  <button slot="ar-button" style="position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); padding: 14px 28px; background-color: #007bff; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;">
    👋 View in your space (AR)
  </button>
</model-viewer>

</body>
</html>
