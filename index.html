<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blender Cube AR Experience</title>
  <!-- Load Google Model Viewer library -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; }
    model-viewer { width: 100%; height: 100%; background-color: #f0f0f0; }
  </style>
</head>
<body>

  <!-- AR Model Viewer Component -->
  <model-viewer 
    src="cube.glb" 
    alt="A 3D Blender Cube" 
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    tone-mapping="neutral" 
    shadow-intensity="1">
    
    <button slot="ar-button" style="position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 12px 24px; background-color: #007bff; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold;">
      👋 View in your space (AR)
    </button>
  </model-viewer>

</body>
</html>
